# Render Blueprint: creates the web service and the Postgres database together.
# In Render: New > Blueprint > pick this repo. Details in README.md.
databases:
  - name: parer-db
    plan: free
    databaseName: parer
    user: parer

services:
  - type: web
    name: parer
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: parer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
